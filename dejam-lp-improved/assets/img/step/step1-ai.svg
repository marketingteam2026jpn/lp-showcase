<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 648" width="1170" height="648" role="img" aria-label="生成AIにプロンプトを入力してHTMLを出力させている画面のイメージ">
<defs>
<style>
.bg{fill:#fff}
.pane{fill:#fff;stroke:#e6e6e6;stroke-width:2}
.bar{fill:#d9dce1}
.bar-l{fill:#e8eaed}
.bubble{fill:#f4f5f7;stroke:#e6e6e6;stroke-width:1.5}
.gut{fill:#f7f7f8}
.num{fill:#b7bcc4;font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace}
.code{font:400 15px ui-monospace,SFMono-Regular,Menlo,monospace}
.tag{fill:#2f6fb5}.atr{fill:#8a8f98}.txt{fill:#4a4f57}.pun{fill:#a9aeb6}
.lbl{fill:#8a8f98;font:600 13px "Noto Sans JP",system-ui,sans-serif}
</style>
</defs>

<rect class="bg" x="0" y="0" width="1170" height="648"/>

<!-- 左: 汎用チャットUI -->
<rect class="pane" x="28" y="28" width="424" height="592" rx="10"/>
<text class="lbl" x="52" y="66">Prompt</text>
<line x1="28" y1="84" x2="452" y2="84" stroke="#eeeff1" stroke-width="2"/>

<g>
  <rect class="bubble" x="52" y="110" width="286" height="86" rx="12"/>
  <rect class="bar" x="72" y="132" width="228" height="9" rx="4.5"/>
  <rect class="bar" x="72" y="152" width="196" height="9" rx="4.5"/>
  <rect class="bar-l" x="72" y="172" width="124" height="9" rx="4.5"/>
</g>
<g>
  <rect class="bubble" x="142" y="216" width="286" height="66" rx="12"/>
  <rect class="bar" x="162" y="238" width="212" height="9" rx="4.5"/>
  <rect class="bar-l" x="162" y="258" width="146" height="9" rx="4.5"/>
</g>
<g>
  <rect class="bubble" x="52" y="302" width="286" height="106" rx="12"/>
  <rect class="bar" x="72" y="324" width="236" height="9" rx="4.5"/>
  <rect class="bar" x="72" y="344" width="214" height="9" rx="4.5"/>
  <rect class="bar" x="72" y="364" width="228" height="9" rx="4.5"/>
  <rect class="bar-l" x="72" y="384" width="108" height="9" rx="4.5"/>
</g>

<!-- 入力欄 -->
<rect x="52" y="530" width="376" height="58" rx="29" fill="#fff" stroke="#dfe1e5" stroke-width="2"/>
<rect class="bar-l" x="78" y="554" width="196" height="10" rx="5"/>
<circle cx="396" cy="559" r="21" fill="#e1201c"/>
<path d="M389 559h13M397 553l6 6-6 6" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

<!-- 右: コードエディタ -->
<rect class="pane" x="480" y="28" width="662" height="592" rx="10"/>
<text class="lbl" x="504" y="66">Output</text>
<line x1="480" y1="84" x2="1142" y2="84" stroke="#eeeff1" stroke-width="2"/>
<rect class="gut" x="481" y="85" width="46" height="534"/>

<g class="num" text-anchor="end">
  <text x="516" y="123">1</text><text x="516" y="151">2</text><text x="516" y="179">3</text>
  <text x="516" y="207">4</text><text x="516" y="235">5</text><text x="516" y="263">6</text>
  <text x="516" y="291">7</text><text x="516" y="319">8</text><text x="516" y="347">9</text>
  <text x="516" y="375">10</text><text x="516" y="403">11</text><text x="516" y="431">12</text>
  <text x="516" y="459">13</text><text x="516" y="487">14</text><text x="516" y="515">15</text>
  <text x="516" y="543">16</text><text x="516" y="571">17</text>
</g>

<g class="code">
  <text x="548" y="123"><tspan class="pun">&lt;</tspan><tspan class="tag">section</tspan> <tspan class="atr">class</tspan><tspan class="pun">=</tspan><tspan class="txt">"hero"</tspan><tspan class="pun">&gt;</tspan></text>
  <text x="572" y="151"><tspan class="pun">&lt;</tspan><tspan class="tag">h1</tspan><tspan class="pun">&gt;</tspan><tspan class="txt">見出しテキスト</tspan><tspan class="pun">&lt;/</tspan><tspan class="tag">h1</tspan><tspan class="pun">&gt;</tspan></text>
  <text x="572" y="179"><tspan class="pun">&lt;</tspan><tspan class="tag">p</tspan><tspan class="pun">&gt;</tspan><tspan class="txt">本文が入ります。</tspan><tspan class="pun">&lt;/</tspan><tspan class="tag">p</tspan><tspan class="pun">&gt;</tspan></text>
  <text x="572" y="207"><tspan class="pun">&lt;</tspan><tspan class="tag">img</tspan> <tspan class="atr">src</tspan><tspan class="pun">=</tspan><tspan class="txt">"hero.webp"</tspan> <tspan class="atr">alt</tspan><tspan class="pun">=</tspan><tspan class="txt">""</tspan><tspan class="pun">&gt;</tspan></text>
  <text x="548" y="235"><tspan class="pun">&lt;/</tspan><tspan class="tag">section</tspan><tspan class="pun">&gt;</tspan></text>

  <text x="548" y="291"><tspan class="pun">&lt;</tspan><tspan class="tag">section</tspan> <tspan class="atr">class</tspan><tspan class="pun">=</tspan><tspan class="txt">"benefit"</tspan><tspan class="pun">&gt;</tspan></text>
  <text x="572" y="319"><tspan class="pun">&lt;</tspan><tspan class="tag">ul</tspan><tspan class="pun">&gt;</tspan></text>
  <text x="596" y="347"><tspan class="pun">&lt;</tspan><tspan class="tag">li</tspan><tspan class="pun">&gt;</tspan><tspan class="txt">特長のひとつめ</tspan><tspan class="pun">&lt;/</tspan><tspan class="tag">li</tspan><tspan class="pun">&gt;</tspan></text>
  <text x="596" y="375"><tspan class="pun">&lt;</tspan><tspan class="tag">li</tspan><tspan class="pun">&gt;</tspan><tspan class="txt">特長のふたつめ</tspan><tspan class="pun">&lt;/</tspan><tspan class="tag">li</tspan><tspan class="pun">&gt;</tspan></text>
  <text x="572" y="403"><tspan class="pun">&lt;/</tspan><tspan class="tag">ul</tspan><tspan class="pun">&gt;</tspan></text>
  <text x="548" y="431"><tspan class="pun">&lt;/</tspan><tspan class="tag">section</tspan><tspan class="pun">&gt;</tspan></text>

  <text x="548" y="487"><tspan class="pun">&lt;</tspan><tspan class="tag">div</tspan> <tspan class="atr">class</tspan><tspan class="pun">=</tspan><tspan class="txt">"cta"</tspan><tspan class="pun">&gt;</tspan></text>
  <text x="572" y="515"><tspan class="pun">&lt;</tspan><tspan class="tag">a</tspan> <tspan class="atr">href</tspan><tspan class="pun">=</tspan><tspan class="txt">"#form"</tspan><tspan class="pun">&gt;</tspan><tspan class="txt">申し込む</tspan><tspan class="pun">&lt;/</tspan><tspan class="tag">a</tspan><tspan class="pun">&gt;</tspan></text>
  <text x="548" y="543"><tspan class="pun">&lt;/</tspan><tspan class="tag">div</tspan><tspan class="pun">&gt;</tspan></text>
</g>

<rect x="540" y="474" width="580" height="28" fill="#e1201c" opacity=".05"/>
</svg>
